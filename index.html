<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DZ Game Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { background: #0d1117; color: #fff; font-family: 'Cairo', sans-serif; margin: 0; padding: 0; }
        header { background: #161b22; padding: 15px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #30363d; flex-wrap: wrap; gap: 10px; position: sticky; top: 0; z-index: 1000; }
        .logo { font-size: 20px; font-weight: 900; color: #58a6ff; cursor: pointer; }
        nav { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
        nav button { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-family: 'Cairo', sans-serif; font-weight: bold; }
        nav button.active { background: #58a6ff; color: #0d1117; }
        .admin-badge { background: #2ea043; color: white; padding: 5px 10px; border-radius: 6px; font-size: 12px; font-weight: bold; cursor: pointer; border: none; }
        .section { display: none; padding: 20px; max-width: 1200px; margin: 0 auto; }
        .section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; margin-top: 15px; }
        .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100%; height: 140px; object-fit: cover; background: #21262d; }
        .card-body { padding: 15px; }
        .card h3 { margin: 0 0 8px 0; font-size: 17px; color: #58a6ff; }
        .card p { margin: 0 0 15px 0; font-size: 13px; color: #8b949e; }
        .btn { background: #2ea043; color: white; border: none; padding: 8px; width: 100%; border-radius: 6px; cursor: pointer; font-weight: bold; font-family: 'Cairo', sans-serif; }
        
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; justify-content: center; align-items: center; padding: 20px; }
        .modal.open { display: flex; }
        .modal-content { background: #161b22; border: 1px solid #30363d; border-radius: 10px; padding: 20px; width: 100%; max-width: 400px; }
        .form-group { margin-bottom: 12px; display: flex; flex-direction: column; gap: 5px; }
        input, select, textarea { background: #0d1117; border: 1px solid #30363d; color: #fff; padding: 8px; border-radius: 6px; font-family: 'Cairo', sans-serif; }
    </style>
</head>
<body>

    <header>
        <div class="logo" onclick="showTab('home', this)">🎮 DZ Game Hub</div>
        <nav>
            <button class="active" onclick="showTab('home', this)">الرئيسية</button>
            <button onclick="showTab('mods', this)">المودات</button>
            <button onclick="showTab('apps', this)">التطبيقات</button>
            <button onclick="showTab('servers', this)">السيرفرات والـ DNS</button>
            <button class="admin-badge" onclick="checkAdmin()">🔐 لوحة المالك</button>
        </nav>
    </header>

    <div id="home" class="section active">
        <h2>مرحباً بك في منصة الجيمرز في الجزائر 🇩🇿</h2>
        <p style="color: #8b949e;">اختر القسم الذي تحتاجه من القائمة في الأعلى.</p>
        <div style="display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap;">
            <button class="btn" style="width: auto;" onclick="showTab('mods', document.querySelectorAll('nav button')[1])">تصفح المودات</button>
            <button class="btn" style="width: auto; background: #58a6ff; color: #0d1117;" onclick="showTab('apps', document.querySelectorAll('nav button')[2])">تصفح التطبيقات</button>
        </div>
    </div>

    <div id="mods" class="section">
        <h2>📦 قسم المودات</h2>
        <div class="grid" id="modsContainer"></div>
    </div>

    <div id="apps" class="section">
        <h2>📱 قسم التطبيقات وأدوات التعديل</h2>
        <div class="grid" id="appsContainer"></div>
    </div>

    <div id="servers" class="section">
        <h2>⚡ حالة السيرفرات وإعدادات الـ DNS</h2>
        <div class="card" style="padding: 15px; margin-top: 10px;">
            <h3>Cloudflare DNS</h3>
            <p>1.1.1.1 / 1.0.0.1</p>
        </div>
    </div>

    <div class="modal" id="addModal">
        <div class="modal-content">
            <h3>➕ إضافة محتوى جديد (خاص بالمالك)</h3>
            <div class="form-group">
                <label>النوع:</label>
                <select id="itemType">
                    <option value="mod">مود ألعاب</option>
                    <option value="app">تطبيق أندرويد</option>
                </select>
            </div>
            <div class="form-group">
                <label>العنوان:</label>
                <input type="text" id="itemTitle" placeholder="اسم المود أو التطبيق">
            </div>
            <div class="form-group">
                <label>المنصة / الفئة:</label>
                <select id="itemPlatform">
                    <option value="Android">Android</option>
                    <option value="PS3">PS3</option>
                    <option value="PC">PC</option>
                </select>
            </div>
            <div class="form-group">
                <label>رابط الصورة:</label>
                <input type="text" id="itemImg" placeholder="https://...">
            </div>
            <div class="form-group">
                <label>الوصف:</label>
                <textarea id="itemDesc" rows="3" placeholder="تفاصيل الملف..."></textarea>
            </div>
            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button class="btn" style="background: #30363d;" onclick="closeModal()">إلغاء</button>
                <button class="btn" onclick="saveNewItem()">حفظ ونشر</button>
            </div>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "123"; 

        const defaultItems = [
            { id: 1, type: "mod", title: "GTA SA DZ - السيارات الجزائرية", platform: "Android", desc: "تعديل سيارات Symbol و Ibiza.", img: "https://images.unsplash.com/photo-1542751371-adc38448a05e?w=500" },
            { id: 2, type: "app", title: "ZArchiver Pro", platform: "Android", desc: "أفضل تطبيق لفك الضغط وتسيير الملفات.", img: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?w=500" }
        ];

        let itemsList = JSON.parse(localStorage.getItem('dz_hub_all_items')) || defaultItems;

        function showTab(tabId, btn) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            const buttons = document.querySelectorAll('nav button');
            buttons.forEach(b => { if(!b.classList.contains('admin-badge')) b.classList.remove('active'); });
            if(btn && !btn.classList.contains('admin-badge')) btn.classList.add('active');
            renderContent();
        }

        function checkAdmin() {
            let pass = prompt("أدخل كلمة سر المشرف (Admin Password):");
            if (pass === ADMIN_PASSWORD) {
                document.getElementById('addModal').classList.add('open');
            } else if (pass !== null) {
                alert("كلمة السر خاطئة! النشر مخصص للمالك فقط.");
            }
        }

        function closeModal() {
            document.getElementById('addModal').classList.remove('open');
        }

        function saveNewItem() {
            const type = document.getElementById('itemType').value;
            const title = document.getElementById('itemTitle').value.trim();
            const platform = document.getElementById('itemPlatform').value;
            const img = document.getElementById('itemImg').value.trim() || "https://images.unsplash.com/photo-1550745165-9bc0b252726f?w=500";
            const desc = document.getElementById('itemDesc').value.trim();

            if (!title || !desc) {
                alert("يرجى ملء الحقول الأساسية!");
                return;
            }

            const newItem = { id: Date.now(), type, title, platform, img, desc };
            itemsList.unshift(newItem);
            localStorage.setItem('dz_hub_all_items', JSON.stringify(itemsList));

            document.getElementById('itemTitle').value = '';
            document.getElementById('itemImg').value = '';
            document.getElementById('itemDesc').value = '';
            closeModal();
            renderContent();
            alert("تم نشر المحتوى بنجاح!");
        }

        function renderContent() {
            const mods = itemsList.filter(i => i.type === 'mod');
            const apps = itemsList.filter(i => i.type === 'app');

            document.getElementById('modsContainer').innerHTML = mods.map(m => `
                <div class="card">
                    <img src="${m.img}" alt="">
                    <div class="card-body">
                        <span style="font-size: 11px; color: #58a6ff; font-weight: bold;">${m.platform}</span>
                        <h3>${m.title}</h3>
                        <p>${m.desc}</p>
                        <button class="btn" onclick="alert('جاري التحميل...')">تحميل الملف</button>
                    </div>
                </div>
            `).join('') || '<p style="color:#8b949e">لا توجد مودات حالياً.</p>';

            document.getElementById('appsContainer').innerHTML = apps.map(a => `
                <div class="card">
                    <img src="${a.img}" alt="">
                    <div class="card-body">
                        <span style="font-size: 11px; color: #bb86fc; font-weight: bold;">${a.platform}</span>
                        <h3>${a.title}</h3>
                        <p>${a.desc}</p>
                        <button class="btn" onclick="alert('جاري التحميل...')">تحميل التطبيق</button>
                    </div>
                </div>
            `).join('') || '<p style="color:#8b949e">لا توجد تطبيقات حالياً.</p>';
        }

        renderContent();
    </script>
</body>
</html>
